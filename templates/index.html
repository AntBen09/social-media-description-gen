<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Social Post Generator</title>
    <style>
        body {
            font-family: -apple-system, Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #17171b;
            color: #eee;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        p.sub {
            color: #999;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 4px;
            font-size: 14px;
            color: #ccc;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #eee;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 70px;
            resize: vertical;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #999;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #ffa03e;
            color: #17171b;
            border-color: #ffa03e;
            font-weight: bold;
        }

        .tab-panel {
            display: none;
            margin-top: 12px;
        }

        .tab-panel.active {
            display: block;
        }

        button.generate {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            background: #ffa03e;
            color: #17171b;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <h1>Social Post Generator</h1>
    <p class="sub">Upload media or paste a transcript, get a description and hashtags</p>

    <div class="tabs">
        <div class="tab-btn active" id="tabMediaBtn" onclick="switchTab('media')">Upload Media</div>
        <div class="tab-btn" id="tabTranscriptBtn" onclick="switchTab('transcript')">Paste Transcript</div>
    </div>

    <div class="tab-panel active" id="tabMedia">
        <label>Video or audio file</label>
        <input type="file" id="mediaFile" accept="video/*,audio/*">
    </div>

    <div class="tab-panel" id="tabTranscript">
        <label>Transcript text</label>
        <textarea id="transcriptText" placeholder="Paste your transcript here"></textarea>
    </div>

    <label>Direction / Context</label>
    <textarea id="direction"
        placeholder="e.g. This is a highlight clip from a comedy podcast episode. Keep it funny and punchy. Or: This is a product launch teaser for a small business, tone should be exciting but professional."></textarea>

    <label>Platform</label>
    <select id="platform">
        <option value="general">General</option>
        <option value="youtube">YouTube</option>
        <option value="instagram">Instagram</option>
        <option value="tiktok">TikTok</option>
        <option value="facebook">Facebook</option>
    </select>

    <button class="generate" onclick="generate()">Generate</button>

    <script>
        function switchTab(tab) {
            document.getElementById("tabMedia").classList.toggle("active", tab === "media");
            document.getElementById("tabTranscript").classList.toggle("active", tab === "transcript");
            document.getElementById("tabMediaBtn").classList.toggle("active", tab === "media");
            document.getElementById("tabTranscriptBtn").classList.toggle("active", tab === "transcript");
        }

        async function generate() {
            const formData = new FormData();

            const mediaFile = document.getElementById("mediaFile").files[0];
            const transcriptText = document.getElementById("transcriptText").value;

            if (mediaFile) {
                formData.append("mediaFile", mediaFile);
            } else if (transcriptText) {
                formData.append("transcriptText", transcriptText);
            } else {
                alert("Upload a file or paste a transcript first");
                return;
            }

            formData.append("direction", document.getElementById("direction").value);
            formData.append("platform", document.getElementById("platform").value);
            const res = await fetch("/generate", { method: "POST", body: formData });
            const data = await res.json();
            console.log("Response from server:", data);
        }
    </script>

</body>

</html>
